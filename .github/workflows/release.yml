# Build both halves on a version tag and attach them to a release.
#
# Both halves, on purpose: a server without the matching app is useless, and the
# pair being built from one commit is the only guarantee that the wire between
# them agrees.
name: release

on:
  push:
    tags:
      - "v*"
  # Buildable on demand as well, so a broken workflow is found without cutting a
  # tag to test it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # From go.mod, not a number pinned here. This said "1.24" while the module
      # asked for a newer Go, and it only built because the go command silently
      # downloads the toolchain it needs — a release should not rest on that
      # going on being true.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Vet
        run: go vet ./...
        working-directory: server

      # Static, for both architectures a Linux machine is plausibly on. CGO off
      # is what lets the binary run on a distribution older than this runner.
      - name: Build
        env:
          CGO_ENABLED: "0"
        working-directory: server
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "linux-terminal-server-linux-$arch" .
          done
          sha256sum linux-terminal-server-linux-* > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: |
            server/linux-terminal-server-linux-*
            server/checksums.txt

  client:
    runs-on: ubuntu-latest
    # At job level so the steps below can branch on whether it is set: the
    # secrets context is not available in a step's own `if`.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The key has to be stable across releases: Android refuses to install an
      # update signed by a different key than the installed copy, and a debug
      # keystore is generated per machine. Without the secret the build still
      # works — it falls back to a debug key, and the APK it produces cannot
      # upgrade an existing install.
      - name: Restore the signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: client
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release*.apk ../linux-terminal.apk

      - name: Say which key signed it
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Signed with the release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — signed with a debug key."
            echo "This APK cannot upgrade an install signed by the release key."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: linux-terminal.apk

  publish:
    needs: [server, client]
    runs-on: ubuntu-latest
    # Only a tag becomes a release; a manual run just leaves the artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-terminal-server-linux-*
            checksums.txt
            linux-terminal.apk
          generate_release_notes: true
          body: |
            ## On the Linux machine

            ```sh
            curl -fL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/linux-terminal-server-linux-amd64 \
                | sudo tee /usr/local/bin/linux-terminal-server > /dev/null
            sudo chmod +x /usr/local/bin/linux-terminal-server
            linux-terminal-server --version
            ```

            `-f` is not decoration: without it curl writes an HTML error page
            into the file and you install something that is not a binary. On an
            ARM box take `-arm64` instead, and `checksums.txt` is published
            beside them.

            No dependencies — it is a static binary. For it to survive a reboot
            it wants a service; the `install` skill in the repository does that
            and the lingering step people forget.

            Dictation needs a transcription endpoint; set one at
            `http://localhost:9104`.

            ## In the headset

            ```sh
            adb install -r linux-terminal.apk
            ```

            The machine you installed the server on is already in the list — it
            answers a discovery probe on the local network. A machine elsewhere
            is added once by address.
